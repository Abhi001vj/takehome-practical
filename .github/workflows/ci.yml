# Model CI: a PR merges only if the harness is sound *and* the model has not regressed.
#
# Split into two jobs on purpose. `checks` is fast (lint + tests, ~1 min) and is what
# catches most mistakes; `evaluate` is the expensive full comparison and only runs if
# `checks` passed, so a typo never costs a full CV sweep.
#
# Only `evaluate` writes the PR comment and only `evaluate` can block the merge on model
# quality - see the gate step. Make both jobs required in branch protection.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the in-flight run for the same branch. Model evaluation is
  # minutes of CPU; there is no value in finishing a run for a commit nobody will merge.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # SQLite-backed MLflow store, not `file://` - MLflow 3 raises on the filesystem backend.
  # SQLite is also the only local backend supporting the model registry, which the gate
  # reads the champion from. A real deployment points this at the tracking server; the
  # code degrades to a no-op if neither is reachable, so CI never fails on tracking.
  MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
  # sentence-transformers writes here; cached between runs.
  HF_HOME: ${{ github.workspace }}/.hf-cache

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        # `not llm` deselects the arms needing a live vLLM endpoint. The embedding arms
        # still run: MiniLM downloads once and runs on CPU.
        run: uv run pytest -q -m "not llm" --cov=support_router --cov-report=term-missing

  evaluate:
    name: Model evaluation and promotion gate
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      pull-requests: write   # to post the report comment
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate compares against the champion recorded on the base branch, so the
          # history has to be deep enough to read it.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --frozen --all-extras

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ hashFiles('conf/params.yaml') }}

      - name: EDA
        run: uv run support-router eda

      - name: Full model comparison
        run: uv run support-router cv --models all,embedding_logreg,embedding_lightgbm --schemes grouped,naive

      - name: Promotion gate
        id: gate
        # THE blocking check. Non-zero exit when the candidate fails to beat the champion
        # by the configured margin, when fraud-report recall falls below the floor, or
        # when fold variance has inflated. `continue-on-error` so the report still gets
        # posted on failure, with the real verdict
        # re-raised in the final step.
        run: uv run support-router gate --candidate-metrics reports/comparison.json
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 30

      - name: Comment the result on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p, fallback) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : fallback;

            const gate = JSON.parse(read('reports/gate.json', '{"passed":false,"checks":[]}'));
            const comparison = read('reports/comparison.md', '_comparison not produced_');

            const icon = gate.passed ? '✅' : '❌';
            const checks = (gate.checks || [])
              .map(c => `| ${c.passed ? '✅' : '❌'} | \`${c.name}\` | ${c.detail || ''} |`)
              .join('\n');

            // Truncated: a full comparison table across both schemes exceeds GitHub's
            // 65536-character comment limit on a bad day. The artifact has everything.
            const body = [
              `## ${icon} Model gate: ${gate.passed ? 'PASSED' : 'FAILED'}`,
              '',
              checks ? `| | check | detail |\n|---|---|---|\n${checks}` : '_no checks recorded_',
              '',
              '<details><summary>Full comparison report</summary>',
              '',
              comparison.slice(0, 55000),
              '',
              '</details>',
              '',
              '_Select on the **grouped** CV column. The naive column is shown only to',
              'quantify what template leakage would have hidden._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Model gate:')
            );

            // Update in place rather than appending: a 20-commit PR should not carry 20
            // stale verdicts, only the current one.
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Enforce the gate
        # Re-raise the verdict deferred above, after the report has been published.
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::the candidate model did not clear the promotion gate"
          exit 1
