[project]
name = "support-router"
version = "0.1.0"
description = "Routes crypto/fintech support messages to one of four queues."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "joblib>=1.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
trees = [
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
]
tracking = [
    "mlflow>=2.14",
    "optuna>=3.6",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
eda = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "wordcloud>=1.9",
]
llm = [
    "sentence-transformers>=3.0",
    "openai>=1.35",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
support-router = "support_router.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises a full model fit; deselect with -m 'not slow'",
    "llm: requires a reachable LLM/embedding backend; deselect with -m 'not llm'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults. Typer's entire API *is* function
# calls in argument defaults (`typer.Option(...)`), so the rule flags every command.
"src/support_router/cli.py" = ["B008"]
# B018 forbids bare expressions; a bare attribute access is the point of a test that
# asserts the access raises.
"tests/*" = ["B018"]
